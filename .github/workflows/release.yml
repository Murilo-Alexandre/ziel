name: Release APK

# Dispara ao publicar uma tag de versão (ex.: v0.1.0-beta.1). Gera o APK ASSINADO e o anexa à Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versão a partir da tag
        id: ver
        run: node scripts/version-from-tag.mjs "$TAG" --github-output >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ZIEL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ZIEL_KEYSTORE_BASE64 ausente. A Release NÃO é publicada sem assinatura."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/ziel-release.jks"
          echo "ZIEL_KEYSTORE_PATH=$RUNNER_TEMP/ziel-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK de release assinado
        working-directory: android
        env:
          ZIEL_KEYSTORE_PASSWORD: ${{ secrets.ZIEL_KEYSTORE_PASSWORD }}
          ZIEL_KEY_ALIAS: ${{ secrets.ZIEL_KEY_ALIAS }}
          ZIEL_KEY_PASSWORD: ${{ secrets.ZIEL_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PzielVersionName=${{ steps.ver.outputs.version_name }}
          -PzielVersionCode=${{ steps.ver.outputs.version_code }}

      - name: Verificar assinatura e identidade da chave
        env:
          EXPECTED_SHA256: ${{ vars.ZIEL_CERT_SHA256 }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          echo "Certificado SHA-256: $ACTUAL"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Variável ZIEL_CERT_SHA256 não configurada (impressão digital esperada da chave)."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::A chave que assinou o APK NÃO é a esperada. Atualizações quebrariam. Abortando."
            exit 1
          fi
          cp "$APK" "Ziel-${TAG}.apk"
          sha256sum "Ziel-${TAG}.apk" > "Ziel-${TAG}.apk.sha256"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          NOTES=""
          if [ -f "docs/release-notes/${TAG}.md" ]; then NOTES="--notes-file docs/release-notes/${TAG}.md"; else NOTES="--generate-notes"; fi
          gh release create "$TAG" "Ziel-${TAG}.apk" "Ziel-${TAG}.apk.sha256" --title "Ziel ${TAG}" $NOTES $FLAGS
